# Applied when a profile lists this package in dsh.profile.bundles.
# Two Host rows (MCP + Vision). The browser client is a single dsh.client
# bundle that must $mount Typert package "dsh-plus" only once.
- insert:
    - id: mcp-settings
      name: dsh-plus
      config:
        path: !!js dshHomePath('mcp-servers.json')
    - id: vision-bridge
      name: dsh-plus/vision
      config:
        path: !!js dshHomePath('vision-bridge.json')
